<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="This is the Product Review Form for the WDD131 assignment.">
    <meta name="author" content="Tyler Allen">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">

            <label for="product-name">Product Name*</label>
            <select name="product" id="product-name" required>
                <option value="" disabled selected>Select a product...</option>
            </select>

            Overall Rating*
            <div class="rating-box">
                <div class="rating-item">
                    <label for="oneStar" class="rating-option">&star;</label>
                    <input type="radio" name="overall-rating" id="oneStar" value="oneStar" required>
                </div>
                <div class="rating-item"><label for="twoStar" class="rating-option">&star;&star;</label>
                    <input type="radio" name="overall-rating" id="twoStar" value="twoStar" required>
                </div>
                <div class="rating-item"><label for="threeStar" class="rating-option">&star;&star;&star;</label>
                    <input type="radio" name="overall-rating" id="threeStar" value="threeStar" required>
                </div>
                <div class="rating-item"><label for="fourStar" class="rating-option">&star;&star;&star;&star;</label>
                    <input type="radio" name="overall-rating" id="fourStar" value="fourStar" required>
                </div>
                <div class="rating-item"><label for="fiveStar" class="rating-option">&star;&star;&star;&star;&star;</label>
                    <input type="radio" name="overall-rating" id="fiveStar" value="fiveStar" required>
                </div>
            </div>

            <label for="installed-date">Date of Instalation*</label>
            <input type="date" id="installed-date" name="installed-date" required>

            Which features did you find useful in the product?
            <i>(Check all that apply)</i>
            <div class="feat-box">
                <div class="feat-item">
                    <input type="checkbox" id="durable-check" name="durable-check" value="yes">
                    <label for="durable-check">Durability</label>
                </div>
                <div class="feat-item">
                    <input type="checkbox" id="ease-check" name="ease-check" value="yes">
                    <label for="ease-check"> Ease of Use</label>
                </div>
                <div class="feat-item">
                    <input type="checkbox" id="performance-check" name="performance-check" value="yes">
                    <label for="performance-check">Performance</label>
                </div>
                <div class="feat-item">
                    <input type="checkbox" id="design-check" name="design-check" value="yes">
                    <label for="design-check">Design</label>
                </div>
            </div>

            <label for="written-review">Written Review <span class="optional-tag">(optional)</span></label>
            <textarea name="written-review" id="written-review" rows="5" cols="50"
                    placeholder="Write your review here"></textarea>

            <label for="userName">Your Name <span class="optional-tag">(optional)</span></label>
            <input type="text" id="userName" name="userName" placeholder="John Smith">

            <input type="submit" id="submitBtn" value="Post My Review">
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> | Tyler Allen | Missouri</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
